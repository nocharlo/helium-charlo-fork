name: One-time Helium exposed asset cleanup

# Only this explicit, maintainer-authorized commit can run the cleanup.
on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-release-asset-cleanup.yml"]

permissions:
  contents: write
  actions: read

concurrency:
  group: one-time-helium-release-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'nocharlo/helium-charlo-fork'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source artifact, replace 0.2.7, retire older extensions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          build_run=40439593164
          expected_sha=0c9ecd344fdd941f55d28544a4ca6a1fd852d65494047d85e8600d78aac1213f
          source_commit=e0eaf101a6f591110693bcc6ccbd6dbef3f15164
          folder="$RUNNER_TEMP/repaired-v027"
          mkdir -p "$folder"
          gh run download "$build_run" --repo "$repo" --name helium-fixed-0.2.7 --dir "$folder"
          gh api "repos/$repo/actions/runs/$build_run" | jq -e '.conclusion == "success" and .head_sha == "432f55329ad441b21fc637b820749297bcd4820f"'
          asset="$folder/Helium-Navigator-v0.2.7.pext"
          python scripts/rebuild_historical_release.py verify --evidence "$folder/release-evidence.json" --artifact "$asset" --tag v0.2.7 --commit "$source_commit"
          echo "$expected_sha  $asset" | sha256sum -c -

          # Verify ALL source assets and themes before starting any mutations.
          old5=sha256:1d15227ebf74372963a6e83b007799b7b055791d97603b38572b9513ad00f8df
          old6=sha256:e6d91b376e9138e8a839fd9f8b901af565f061023fa1a8a1263b76e04f0f9357
          old7=sha256:3768d56c3d26df183f082152a96677996cf61fa1662db4e596b2287754ca4c96
          theme5=sha256:b9753a1e4385832da240b7aa88b94514ec584d4aa371595926125f4ca28bcf36
          theme6=sha256:65a3e2b4acb1ef833fd3b280914cc77b383b9f3ac1824cc4f673a7a0594ebe84
          theme7=sha256:df84746719d0529021bcdd0e370b1a98cb70dde2272b1b009b4e919208b18ee4
          for version in 5 6 7; do
            if [ "$version" = 6 ]; then tag=v.0.2.6; else tag=v0.2.$version; fi
            ext=Helium-Navigator-v0.2.$version.pext
            case "$version" in
              5) old="$old5"; theme="$theme5" ;;
              6) old="$old6"; theme="$theme6" ;;
              7) old="$old7"; theme="$theme7" ;;
            esac
            gh api "repos/$repo/releases/tags/$tag" > "$RUNNER_TEMP/release-$version.json"
            jq -e --arg n "$ext" --arg d "$old" --arg t "$theme" \
              '([.assets[] | select(.name == $n and .digest == $d)] | length) == 1 and ([.assets[] | select(.name | endswith(".pthm")) | select(.digest == $t)] | length) == 1' \
              "$RUNNER_TEMP/release-$version.json"
          done

          # Replace most recent extension before withdrawing earlier ones.
          gh release upload v0.2.7 "$asset" --clobber --repo "$repo"
          gh api "repos/$repo/releases/tags/v0.2.7" > "$RUNNER_TEMP/updated7.json"
          jq -e --arg d "sha256:$expected_sha" --arg t "$theme7" \
            '([.assets[] | select(.name == "Helium-Navigator-v0.2.7.pext" and .digest == $d)] | length) == 1 and ([.assets[] | select(.digest == $t)] | length) == 1' \
            "$RUNNER_TEMP/updated7.json"
          note7="Security maintenance: The Navigator extension was rebuilt from the original v0.2.7 source with developer-machine debug paths removed. Replacement .pext SHA-256: $expected_sha."
          old_notes7="$(jq -r '.body // ""' "$RUNNER_TEMP/updated7.json")"
          gh release edit v0.2.7 --notes "$old_notes7"$'\n\n'"$note7" --repo "$repo"

          # Retire ONLY .pext from legacy releases, leaving both theme files.
          for version in 5 6; do
            if [ "$version" = 6 ]; then tag=v.0.2.6; theme="$theme6"; else tag=v0.2.5; theme="$theme5"; fi
            ext=Helium-Navigator-v0.2.$version.pext
            release_json="$RUNNER_TEMP/release-$version.json"
            old_notes="$(jq -r '.body // ""' "$release_json")"
            notice='Superseded by v0.2.7. The older Navigator .pext asset was withdrawn because it included a local development-path reference; install the fixed v0.2.7 packages instead. The original theme .pthm remains for reference.'
            gh release edit "$tag" --notes "$old_notes"$'\n\n'"$notice" --repo "$repo"
            gh release delete-asset "$tag" "$ext" --yes --repo "$repo"
            gh api "repos/$repo/releases/tags/$tag" > "$RUNNER_TEMP/checked-$version.json"
            jq -e --arg n "$ext" --arg t "$theme" \
              '([.assets[] | select(.name == $n)] | length) == 0 and ([.assets[] | select(.digest == $t)] | length) == 1' \
              "$RUNNER_TEMP/checked-$version.json"
            echo "PASS old Navigator asset removed from $tag; theme preserved"
          done
          echo "PASS v0.2.7 extension replaced and verified: $expected_sha"
